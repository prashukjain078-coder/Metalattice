<!doctype html>
<html lang="en" style="background-color: #080B10; color: #F4F7FB;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MetaLattice — AI-Powered Lattice Design Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #080B10;
        color: #F4F7FB;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
      }
      #root {
        width: 100%;
        height: 100%;
      }
      /* Fallback banner if opened via file:// */
      .file-protocol-warning {
        display: none;
        position: fixed;
        inset: 0;
        background: #080B10;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
    </style>
  </head>
  <body style="background-color: #080B10; color: #F4F7FB;">
    <div id="file-warning" class="file-protocol-warning" style="display: none;">
      <div style="background: #111823; border: 1px solid #263342; border-radius: 16px; padding: 32px; max-width: 520px; box-shadow: 0 20px 40px rgba(0,0,0,0.6);">
        <div style="width: 48px; height: 48px; border-radius: 12px; background: rgba(0, 229, 255, 0.1); border: 1px solid rgba(0, 229, 255, 0.3); display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; color: #00E5FF; font-size: 20px;">
          ⚡
        </div>
        <h2 style="font-size: 20px; font-weight: 700; margin: 0 0 8px; color: #F4F7FB;">MetaLattice Local Server Required</h2>
        <p style="font-size: 13px; line-height: 1.6; color: #98A6B8; margin: 0 0 24px;">
          Browsers block 3D WebGL shaders and modern ES modules when opened via <code style="color: #00E5FF; background: #17212D; padding: 2px 6px; border-radius: 4px;">file:///</code> protocol. Please open via the local dev server.
        </p>
        <a href="http://localhost:5173" style="display: inline-block; background: linear-gradient(135deg, #00E5FF, #0088cc); color: #080B10; font-weight: 600; font-size: 14px; padding: 12px 24px; border-radius: 8px; text-decoration: none; margin-bottom: 16px; box-shadow: 0 0 20px rgba(0, 229, 255, 0.35);">
          Open on http://localhost:5173 →
        </a>
        <p style="font-size: 11px; color: #98A6B8; margin: 0;">
          Tip: You can also double-click <strong style="color: #F4F7FB;">start.bat</strong> in this folder to start the server automatically.
        </p>
      </div>
    </div>

    <div id="root"></div>

    <script>
      if (window.location.protocol === 'file:') {
        // Show the helpful launcher card if opened via file://
        document.getElementById('file-warning').style.display = 'flex';
        // Attempt automatic redirect to the running local server
        setTimeout(function() {
          window.location.href = 'http://localhost:5173';
        }, 1000);
      }
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
